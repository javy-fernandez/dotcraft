[graph]
all-features = true

[advisories]
unmaintained = "workspace"
yanked = "deny"

[licenses]
# NCSA is required by libfuzzer-sys in the separate fuzz graph.
allow = [
    "0BSD", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
    "BSD-3-Clause", "BSL-1.0", "CC0-1.0", "CDLA-Permissive-2.0",
    "ISC", "MIT", "MIT-0", "MPL-2.0", "NCSA", "OFL-1.1", "Unicode-3.0",
    "Unlicense", "Ubuntu-font-1.0", "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[bans]
# Existing cross-platform dependency graph legitimately contains parallel major versions.
# Record them for review; a blanket deny would break on unrelated upstream upgrades.
multiple-versions = "warn"
# Local rc-* path dependencies appear as '*' in Cargo metadata; keep them visible.
wildcards = "warn"
allow-wildcard-paths = true
