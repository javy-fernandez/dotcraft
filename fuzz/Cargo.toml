[workspace]
members = ["."]

[package]
name = "dotcraft-security-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
rc-core = { path = "../crates/rc-core" }
rc-dotnet = { path = "../crates/rc-dotnet" }

[[bin]]
name = "session_input"
path = "fuzz_targets/session_input.rs"
test = false
doc = false
bench = false

[[bin]]
name = "project_file"
path = "fuzz_targets/project_file.rs"
test = false
doc = false
bench = false

[[bin]]
name = "test_reports"
path = "fuzz_targets/test_reports.rs"
test = false
doc = false
bench = false
