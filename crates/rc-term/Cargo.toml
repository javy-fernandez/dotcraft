[package]
name = "rc-term"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
egui.workspace = true
rc-kit = { path = "../rc-kit" }
rc-core = { path = "../rc-core" }
alacritty_terminal = "0.26"
portable-pty = "0.9"
anyhow = "1.0"
parking_lot = "0.12"

[dev-dependencies]
egui_kittest.workspace = true
wgpu.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
# The workspace disables eframe's default window backends; terminal integration tests
# still compile its winit dependency through rc-kit and need one Linux backend.
winit = { version = "0.30", default-features = false, features = ["x11"] }
