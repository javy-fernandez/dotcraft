[package]
name = "rc-dotnet"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dunce.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
roxmltree = "0.20"
rc-core = { path = "../rc-core" }
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "sync", "time", "macros", "fs"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "http2", "gzip", "system-proxy"] }
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
tempfile = "3"
