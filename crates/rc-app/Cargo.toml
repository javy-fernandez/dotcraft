[package]
name = "rc-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "DotCraft: a lightweight native IDE for .NET"

[[bin]]
name = "dotcraft"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "=0.40.1", features = ["bundled", "hooks", "limits", "extra_check"] }
fallible-iterator = "0.3"
dunce.workspace = true
tokio.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "system-proxy", "http2"] }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
egui.workspace = true
eframe.workspace = true
egui-wgpu.workspace = true
wgpu.workspace = true
rc-text.workspace = true
rc-syntax.workspace = true
rc-editor.workspace = true
rc-kit.workspace = true
rc-core.workspace = true
rc-remote.workspace = true
rc-dotnet.workspace = true
rc-lsp.workspace = true
rc-term.workspace = true
rc-search.workspace = true
rc-vcs.workspace = true
rc-dap.workspace = true
rfd = "0.17"
dirs = "6"
muda = { version = "0.21", default-features = false }
egui_commonmark = { version = "0.25", default-features = false, features = ["pulldown_cmark", "load-images"] }
egui_extras = { version = "0.36", default-features = false, features = ["image", "file"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
# SQL Server (read-only Database window): TDS over TCP with rustls; passwords in the OS keychain.
tiberius = { version = "0.13", default-features = false, features = ["tds73", "rustls", "sql-browser-tokio"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures-util = { version = "0.3", default-features = false }
roxmltree = "0.20"
keyring = { version = "3.6", default-features = false }
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["apple-native"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSURL", "NSString"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }
tiberius = { version = "0.13", default-features = false, features = ["tds73", "rustls", "sql-browser-tokio", "winauth"] }
windows-sys = { version = "0.61", features = ["Win32_System_Time"] }
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "dx12", "wgsl"] }

# Linux: Vulkan (or OpenGL ES where there is none), on X11 and Wayland.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["linux-native"] }
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "vulkan", "gles", "wgsl"] }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu_no_default_features", "persistence", "x11", "wayland"] }

[dev-dependencies]
egui_kittest.workspace = true
tempfile = "3"

[build-dependencies]
embed-resource = "3.0"
