[package]
name = "rc-vcs"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dunce.workspace = true
rc-core = { path = "../rc-core" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "process", "io-util"] }
thiserror = "2"
regex = "1"
serde.workspace = true
serde_json.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "system-proxy", "http2"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[dev-dependencies]
tempfile = "3"
proptest = "1"
criterion = "0.8"

[[bench]]
name = "line_diff"
harness = false
