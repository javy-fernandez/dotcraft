[package]
name = "rc-vcs"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rc-core = { path = "../rc-core" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "process", "io-util"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
proptest = "1"
criterion = "0.8"

[[bench]]
name = "line_diff"
harness = false
