# Builds DotCraft and runs the workspace tests on every pull request and push to main.
# The tests that talk to the real .NET SDK, Roslyn and netcoredbg run too: the SDKs are
# installed below and the language server and debugger are downloaded on first use.
# Tests marked #[ignore] (GPU captures, git-lfs, network-only NuGet checks) are skipped.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libxkbcommon-dev libwayland-dev

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Configure git
        run: |
          git config --global user.name "DotCraft CI"
          git config --global user.email "ci@dotcraft.invalid"

      - name: Test
        run: cargo test --workspace --locked --no-fail-fast
