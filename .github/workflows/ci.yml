# Builds DotCraft and runs the workspace tests on every pull request and push to main.
# The tests that talk to the real .NET SDK and netcoredbg run too: the SDKs are installed
# below and the debugger is downloaded on first use. Ubuntu 24.04 because the netcoredbg
# Linux build needs glibc 2.38.
# Tests marked #[ignore] (GPU captures, git-lfs, network-only NuGet checks) are skipped.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libxkbcommon-dev libwayland-dev

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Configure git
        run: |
          git config --global user.name "DotCraft CI"
          git config --global user.email "ci@dotcraft.invalid"

      # Skipped here: tests that need the Roslyn language server already installed and the
      # SDK chooser dialog test, which fails on Linux runners.
      - name: Test
        run: >
          cargo test --workspace --locked --no-fail-fast --
          --skip insight_tests::
          --skip remote_backend_tests::remote_roslyn_answers_through_the_agent_with_mirror_paths
          --skip remote_backend_tests::a_remote_folder_opens_edits_saves_and_navigates_in_the_app
          --skip sdk_settings_return_tests::
