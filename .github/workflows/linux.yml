# Linux builds for the releases. The macOS dmg and the Windows zips are built on a Mac and
# uploaded with `gh release create`; publishing that release starts this workflow, which builds
# DotCraft on Ubuntu (x64 and ARM64) and uploads DotCraft-<version>-linux-<arch>.tar.gz to it.
# A pull request that touches this file builds without uploading, and "Run workflow" rebuilds
# the archives of an existing release.
name: Linux release build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and upload to (e.g. v0.3.1)
        required: true
  pull_request:
    paths:
      - .github/workflows/linux.yml
      - assets/dotcraft.desktop
      - crates/rc-app/Cargo.toml

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 (glibc 2.35) so the binary also runs on older distributions.
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.sha }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libxkbcommon-dev libwayland-dev

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}

      - name: Build
        run: cargo build --locked --release

      - name: Package
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          dir=DotCraft
          mkdir -p "$dir"
          install -m 755 target/release/dotcraft "$dir/dotcraft"
          install -m 644 assets/icon.png "$dir/dotcraft.png"
          install -m 644 assets/dotcraft.desktop LICENSE-MIT LICENSE-APACHE "$dir/"
          archive="DotCraft-$version-linux-${{ matrix.arch }}.tar.gz"
          tar -czf "$archive" "$dir"
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
          ldd "$dir/dotcraft"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: ${{ env.ARCHIVE }}

      - name: Upload to the release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$ARCHIVE" --clobber
